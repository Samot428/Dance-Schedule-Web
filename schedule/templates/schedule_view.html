<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule View</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #2b2b2b;
            color: #dcdcdc;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .header {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #dc3545;
            padding: 15px;
            color: white;
        }

        .header h1 {
            margin: 0;
        }

        .header-nav-btn {
            position: absolute;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.15);
            color: white;
            padding: 8px 14px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
        }

        .header-nav-btn:hover {
            background-color: rgba(0, 0, 0, 0.3);
        }
        
        .main-container {
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        .left-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
        }

        .panel {
            width: 100%;
            background-color: #3a3a3a;
            padding: 20px;
            border-radius: 8px;
        }

        .assign-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap; /* allow wrapping so button can move below */
            
            width: 100%; /* span full day-card content width */
            box-sizing: border-box;
            background-color: #2b2b2b; /* match couple-list background */
            border-radius: 4px; /* match couple-list radius */
            padding: 10px; /* match couple-list padding */
            justify-content: center; /* center contents */
        }

        .assign-row .assign-fields {
            display: flex;
            flex-direction: column; /* stack rows vertically */
            align-items: center; /* center each control */
            gap: 8px;
            flex: 0 0 auto; /* only as wide as content */
            min-width: 0; /* allow content to shrink */
        }

        .assign-line {
            display: flex; /* keep label and select on one line */
            align-items: center;
            gap: 8px;
        }

        .assign-row .form-select {
            background-color: #2b2b2b;
            border: 1px solid #555;
            color: #dcdcdc;
            display: inline-block;
            min-width: 150px; /* tighter minimum to help fit */
            flex: 0 1 auto; /* fit content, don't force growth */
            white-space: nowrap;
        }

        .assign-row .btn {
            width: auto;
            flex: 0 0 auto; /* keep button to its content width */
        }

        .dropzone {
            background: #2b2b2b;
            border: 2px dashed #4caf50;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            color: #dcdcdc;
            font-family: 'Segoe UI', sans-serif;
            transition: background 0.3s ease;
        }

        .dropzone.dragover {
        background: #3a3a3a;
        }

        .dropzone .browse {
        color: #4caf50;
        text-decoration: underline;
        cursor: pointer;
        }

        .dropzone p {
        margin-bottom: 8px;
        }

        #fileInput {
            display: none;
        }

        .files-list {
            background-color: #2b2b2b;
            border-radius: 4px;
            padding: 10px;
            margin-top: 10px;
            max-height: 200px;
            overflow-y: auto;
        }

        .file-item {
            background-color: #3a3a3a;
            padding: 8px 12px;
            margin-bottom: 6px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9em;
        }

        .file-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-size {
            color: #888;
            margin-left: 10px;
            font-size: 0.85em;
        }

        .btn-remove-file {
            background-color: #dc3545;
            color: white;
            padding: 3px 8px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            margin-left: 10px;
        }

        .btn-remove-file:hover {
            background-color: #c82333;
        }

        @media (max-width: 768px) {
            .header-nav-btn { position: static; display: inline-block; margin-top: 8px; }
        }

    </style>
</head>
<body>
    <div class="header">
        <h1>Create the Schedule</h1>
        <a href="{% url 'calendar_view' %}" class="header-nav-btn">← Back to Calendar</a>
    </div>
    <div class="main-container">
        <div class="left-section">
            <div class="dropzone" id="dropzone"> 
                <p><strong>Upload the Excel Table:</strong></p> 
                <p>Drag & Drop<br>or <span class="browse">browse files</span></p>
                <p style="font-size: 0.9em; color: #666">Supports: .xlsx, .xls</p>
                <input type="file" id="fileInput" multiple accept=".xlsx, .xls"> 
            </div>

            <div class="panel">
                <h5 style="margin-bottom: 10px;">Uploaded Files:</h5>
                <div id="filesList" class="files-list"></div>
            </div>
                
            <div class="panel">
                <div class="assign-row">
                    <div class="assign-fields">
                        <div class="assign-line">
                            <label style="flex: none;">Sort couples by:</label>
                            <select name="sort_by" class="form-select" style="background-color: #0d6efd; color: white;">
                                <option value="-" selected>Random</option>
                                <option value="class">Class Level</option>
                                <option value="group">Group Index</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success">Create Schedule</button>
                    </div>
                    
                </div>
            </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const browse = dropzone.querySelector('.browse');
        const filesList = document.getElementById('filesList');
        let uploadedFiles = [];

        browse.onclick = () => fileInput.click();

        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });
        dropzone.addEventListener('dragleave', () => {
            dropzone.classList.remove('dragover');
        });
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', () => {
            handleFiles(fileInput.files);
        });

        function handleFiles(files) {
            // Add files to our list
            for (let file of files) {
                uploadedFiles.push(file);
            }
            updateFilesList();
            uploadFiles(files);
        }

        function uploadFiles(files) {
            const formData = new FormData();
            for (let file of files) {
                formData.append('files', file);
            }
            
            // Get CSRF token
            const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]')?.value || getCookie('csrftoken');
            
            fetch('/schedule/upload_schedule_files/', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': csrftoken
                },
                body: formData
            })
            .then(response => response.json())  
            .then(data => {
                if (data.status === 'success') {
                    // Refresh server-backed list and clear local selection
                    loadExistingFiles();
                    uploadedFiles = [];
                    updateFilesList();
                } else {
                    alert('Upload failed!');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Upload error!');
            });
        }

        function updateFilesList() {
            if (uploadedFiles.length === 0) {
                filesList.innerHTML = '<p style="color: #888; text-align: center; padding: 10px;">No files uploaded yet</p>';
                return;
            }

            filesList.innerHTML = '';
            uploadedFiles.forEach((file, index) => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';

                const fileName = document.createElement('span');
                fileName.className = 'file-name';
                fileName.textContent = file.name;
                fileName.title = file.name;

                const fileSize = document.createElement('span');
                fileSize.className = 'file-size';
                fileSize.textContent = formatFileSize(file.size);

                const removeBtn = document.createElement('button');
                removeBtn.className = 'btn-remove-file';
                removeBtn.textContent = '×';
                removeBtn.onclick = () => removeFile(index);

                fileItem.appendChild(fileName);
                fileItem.appendChild(fileSize);
                fileItem.appendChild(removeBtn);
                filesList.appendChild(fileItem);
            });
        }

        function removeFile(index) {
            uploadedFiles.splice(index, 1);
            updateFilesList();
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        // Initialize with empty state
        updateFilesList();
        
        // Function to get CSRF token from cookies
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        function loadExistingFiles() {
            const url = '/schedule/get_uploaded_files/?t=' + Date.now(); // cache-busting
            fetch(url, {
                cache: 'no-store',
                headers: { 'Cache-Control': 'no-cache' }
            })
            .then(response => response.json())
            .then(data => {
                displayServerFiles(data.files || []);
            })
            .catch(error => {
                console.error('Error loading files:', error);
            });
        }
        
        function displayServerFiles(files) {
            filesList.innerHTML = '';
            files.forEach(file => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';

                const fileName = document.createElement('span');
                fileName.className = 'file-name';
                fileName.textContent = file.filename;

                const fileSize = document.createElement('span');
                fileSize.className = 'file-size';
                fileSize.textContent = formatFileSize(file.size);

                const removeBtn = document.createElement('button');
                removeBtn.className = 'btn-remove-file';
                removeBtn.textContent = '×';
                removeBtn.onclick = () => deleteServerFile(file.id);

                const link = document.createElement('a');
                link.href = file.url;
                link.textContent = 'Download';
                link.style.marginLeft = '10px';
                link.target = '_blank';

                fileItem.appendChild(fileName);
                fileItem.appendChild(link); 
                fileItem.appendChild(fileSize);
                fileItem.appendChild(removeBtn);
                filesList.appendChild(fileItem);
            })
        }
        function deleteServerFile(fileId) {
            const csrftoken = getCookie('csrftoken');

            fetch(`/schedule/delete_uploaded_file/${fileId}/`, {
                method:'DELETE',
                headers: {
                    'X-CSRFToken': csrftoken
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    loadExistingFiles();
                }
            })
            .catch(error => console.error('Error:', error));
        }

        // Call on page load to fetch existing files
        loadExistingFiles();
    </script>
</body>
</html>
